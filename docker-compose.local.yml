services:
  backend:
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: remesas_frontend_dev
    build: false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - remesas
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  webserver:
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html

  db:
    image: mysql:8.0
    container_name: remesas_db
    restart: unless-stopped
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - remesas

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: remesas_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PHPMA_PORT}:80"
    networks:
      - remesas
    depends_on:
      - db

volumes:
  dbdata:
