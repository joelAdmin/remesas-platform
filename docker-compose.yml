services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: remesas-app
    container_name: remesas_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - remesas

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: remesas-frontend
    container_name: remesas_frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - remesas
    command: >
      sh -c "
        cp -r /app/dist/. /usr/share/nginx/html/ &&
        tail -f /dev/null
      "

  webserver:
    image: nginx:latest
    container_name: remesas_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - remesas

  redis:
    image: redis:alpine
    container_name: remesas_redis
    restart: unless-stopped
    networks:
      - remesas

networks:
  remesas:
    driver: bridge

volumes:
  frontend_dist:
