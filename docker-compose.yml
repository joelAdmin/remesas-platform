services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: remesas-app
    container_name: remesas_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    networks:
      - remesas
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: remesas-frontend
    container_name: remesas_frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/usr/share/nginx/html
      - ./frontend:/app:ro
    networks:
      - remesas
    command: >
      sh -c "
        echo '🚀 Construyendo frontend...' &&
        cd /app &&
        npm ci &&
        npm run build &&
        echo '📁 Copiando archivos al webserver...' &&
        cp -r /app/dist/. /usr/share/nginx/html/ &&
        echo '✅ Frontend listo. Manteniendo contenedor vivo...' &&
        tail -f /dev/null
      "

  webserver:
    image: nginx:latest
    container_name: remesas_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - remesas

  db:
    image: mysql:8.0
    container_name: remesas_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - remesas

  redis:
    image: redis:alpine
    container_name: remesas_redis
    restart: unless-stopped
    networks:
      - remesas

networks:
  remesas:
    driver: bridge

volumes:
  dbdata:
  frontend_dist:
