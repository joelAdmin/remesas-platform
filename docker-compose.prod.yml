services:
  backend:
    environment:
      - DB_HOST=page_app_prod_db
      - DB_PORT=3306
    networks:
      - page_app_prod_laravel

  frontend:
    networks:
      - page_app_prod_laravel

  webserver:
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist:/usr/share/nginx/html
    networks:
      - page_app_prod_laravel

  redis:
    networks:
      - page_app_prod_laravel

networks:
  page_app_prod_laravel:
    external: true
